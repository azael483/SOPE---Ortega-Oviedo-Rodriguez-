<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Empleado | SOPEMASTER</title>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{
            --orange:#F5A623;
            --black:#111111;
            --white:#ffffff;
            --gray:#e5e5e5;
            --dark:#1a1a1a;
        }

        body{
            font-family:'Montserrat',sans-serif;
            background:var(--gray);
            color:var(--black);
        }

        header{
            background:var(--orange);
            height:90px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 40px;
        }

        .logo{
            font-family:'Bebas Neue',sans-serif;
            font-size:2.4rem;
            letter-spacing:2px;
        }

        .logout{
            background:var(--black);
            color:white;
            border:none;
            padding:12px 20px;
            cursor:pointer;
            font-weight:700;
        }

        .hero{
            background:var(--dark);
            color:white;
            padding:60px;
        }

        .hero h1{
            font-family:'Bebas Neue',sans-serif;
            font-size:4rem;
            letter-spacing:3px;
        }

        .container{

            padding:40px;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:30px;

        }

        .card{

            background:white;
            border-radius:12px;
            padding:30px;
            box-shadow:0 4px 12px rgba(0,0,0,.08);

        }

        .card h2{

            font-family:'Bebas Neue',sans-serif;
            font-size:2rem;
            margin-bottom:20px;

        }

        input{

            width:100%;
            padding:14px;
            border:none;
            background:#eee;
            margin-bottom:16px;

        }

        button{

            background:var(--orange);
            border:none;
            padding:14px 20px;
            font-weight:700;
            cursor:pointer;

        }

        table{

            width:100%;
            border-collapse:collapse;

        }

        th{

            background:var(--orange);
            padding:12px;
            text-align:left;

        }

        td{

            padding:12px;
            border-bottom:1px solid #ddd;

        }

    </style>

</head>

<body>

    <header>

        <div class="logo">
            SOPEMASTER 👆
        </div>

        <button class="logout" onclick="logout()">
            CERRAR SESIÓN
        </button>

    </header>

    <section class="hero">

        <h1>
            PANEL EMPLEADO
        </h1>

        <p>
            Gestión operativa y validación de boletos
        </p>

    </section>

    <section class="container">

        <div class="card">

            <h2>
                VALIDAR BOLETO
            </h2>

            <input
                type="text"
                id="boleto"
                placeholder="ID DEL BOLETO"
            >

            <button onclick="validarBoleto()">
                VALIDAR ENTRADA
            </button>

            <p
                id="resultado"
                style="margin-top:20px;font-weight:700;"
            ></p>

        </div>

        <div class="card">

            <h2>
                INVENTARIO EVENTOS
            </h2>

            <table>

                <thead>

                    <tr>

                        <th>Evento</th>
                        <th>Disponibles</th>

                    </tr>

                </thead>

                <tbody id="tablaEventos">

                </tbody>

            </table>

        </div>

    </section>

    <script src="backend/empleado.js"></script>

</body>

</html>
