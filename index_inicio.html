<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sopemaster 👆 Eventos y Boletos</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --orange: #F5A623;
      --black: #111111;
      --white: #ffffff;
      --gray-bg: #e5e5e5;
    }
 
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--gray-bg);
      color: var(--black);
    }
 
   
    header {
      background: var(--orange);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 90px;
    }
 
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
 
    .logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.6rem;
      color: var(--black);
      letter-spacing: 2px;
    }
 
    .logo-icon {
      font-size: 2rem;
      transform: rotate(-15deg);
      display: inline-block;
    }
 
    nav {
      display: flex;
      align-items: center;
      gap: 40px;
    }
 
    nav a {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--black);
      text-decoration: none;
      white-space: nowrap;
    }
 
    nav a:hover { text-decoration: underline; }
 
    .btn-signin {
      background: var(--black);
      color: var(--white) !important;
      padding: 10px 18px;
      font-size: 0.68rem !important;
      letter-spacing: 1.2px;
      border: none;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      text-decoration: none;
    }
 
    .btn-signin:hover { background: #333; text-decoration: none !important; }
 
    
    .search-bar {
      background: var(--orange);
      display: flex;
      align-items: center;
      padding: 0 110px;
      height: 64px;
      gap: 0;
    }
 
    .search-field {
      display: flex;
      align-items: center;
      background: var(--orange);
      flex: 1;
      border-right: 2px solid rgba(0,0,0,0.15);
      height: 100%;
      gap: 12px;
      padding: 0 20px;
    }
 
    .search-field:last-child { border-right: none; }
 
    .search-field svg, .search-field .icon {
      font-size: 1.3rem;
      flex-shrink: 0;
      color: var(--black);
    }
 
    .search-field input {
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--black);
      width: 100%;
    }
 
    .search-field input::placeholder { color: var(--black); opacity: 0.85; }
 
  
    .hero {
      position: relative;
      width: 100%;
      height: 520px;
      overflow: hidden;
      background: #000;
    }
 
    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      opacity: 0.85;
      display: block;
    }
 
    
    .hero-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a1a 0%, #3a3a3a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }
 
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.55) 35%, transparent 70%);
    }
 
    .hero-content {
      position: absolute;
      top: 50%;
      left: 7%;
      transform: translateY(-50%);
      color: var(--white);
    }
 
    .hero-subtitle {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 6px;
      opacity: 0.9;
    }
 
    .hero-en {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 14px;
    }
 
    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 5rem;
      line-height: 1;
      letter-spacing: 4px;
      text-shadow: 2px 2px 12px rgba(0,0,0,0.6);
    }
 
    .hero-title em {
      font-style: italic;
      color: var(--white);
    }
 
    .btn-tickets {
      position: absolute;
      top: 50%;
      right: 8%;
      transform: translateY(-50%);
      background: var(--orange);
      color: var(--black);
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 16px 32px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      white-space: nowrap;
    }
 
    .btn-tickets:hover {
      background: #e0941a;
      transform: translateY(-50%) scale(1.04);
    }
 
   
    @media (max-width: 900px) {
      .search-bar { padding: 0 20px; }
      nav { gap: 20px; }
      .hero-title { font-size: 3.5rem; }
      .btn-tickets { right: 3%; padding: 12px 20px; font-size: 0.75rem; }
    }
 
    @media (max-width: 640px) {
      header { padding: 0 16px; height: 70px; }
      .logo-text { font-size: 1.9rem; }
      nav { gap: 12px; }
      nav a { font-size: 0.6rem; }
      .search-bar { height: auto; flex-direction: column; padding: 12px 16px; gap: 8px; }
      .search-field { border-right: none; border-bottom: 1px solid rgba(0,0,0,0.15); width: 100%; height: 44px; }
      .search-field:last-child { border-bottom: none; }
      .hero { height: 420px; }
      .hero-title { font-size: 2.8rem; }
      .btn-tickets { position: relative; top: auto; right: auto; transform: none; margin: 20px auto 0; display: block; text-align: center; width: fit-content; }
      .hero-content { position: relative; top: auto; left: auto; transform: none; padding: 30px 20px 0; }
      .hero-overlay { background: rgba(0,0,0,0.5); }
    }
  </style>
</head>
<body>
 
  
  <header>
    <a href="#" class="logo">
      <span class="logo-text">SOPEMASTER</span>
      <span class="logo-icon">👆</span>
    </a>
 
    <nav>
      <a href="#">Eventos Próximos ›</a>
      <a href="#">Mis eventos ›</a>
      <a href="#">Acerca de Nosotros ›</a>
      <a href="#" class="btn-signin">Sign In Administrator</a>
    </nav>
  </header>
 
 
  <div class="search-bar">
    <div class="search-field">
    
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
        <circle cx="12" cy="9" r="2.5"/>
      </svg>
      <input type="text" placeholder="Ubicación" />
    </div>
 
    <div class="search-field">

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <input type="text" placeholder="Fecha" />
    </div>
 
    <div class="search-field">
  
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" placeholder="Buscar Artista, Evento, Inmueble" />
    </div>
  </div>
 
  <section class="hero">
    
    <div class="hero-placeholder" style="position:absolute;inset:0;">
       <img class="hero-img" src="https://cdn.milenio.com/uploads/media/2019/09/28/jose-jose-murio-a-los-1.jpg" alt="José José" />
    </div>
 
    <div class="hero-overlay"></div>
 
    <div class="hero-content">
      <p class="hero-subtitle">José José</p>
      <p class="hero-en">En</p>
      <h1 class="hero-title">
        <em>El Amar<br>y el<br>Querer</em>
      </h1>
    </div>
 
    <a href="#" class="btn-tickets">Ver Boletos</a>
  </section>
 
</body>
</html>
